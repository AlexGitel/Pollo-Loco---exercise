<!DOCTYPE html>
<html lang="en" translate="no">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
        <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
        <link rel="manifest" href="/assets/favicon/site.webmanifest" />

        <link rel="stylesheet" href="standard.css">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="assets/fonts/fonts.css">
        <script src="classes/drawable-object.class.js"></script>
        <script src="classes/movable-object.class.js"></script>
        <script src="classes/character.class.js"></script>
        <script src="classes/chicken.class.js"></script>
        <script src="classes/chicken-small.class.js"></script>
        <script src="classes/cloud.class.js"></script>
        <script src="classes/statusbar-health.class.js"></script>
        <script src="classes/statusbar-endboss.class.js"></script>
        <script src="classes/statusbar-coins.class.js"></script>
        <script src="classes/statusbar-bottles.class.js"></script>
        <script src="classes/world.class.js"></script>
        <script src="classes/background-objects.class.js"></script>
        <script src="classes/keyboard.class.js"></script>
        <script src="classes/level.class.js"></script>
        <script src="classes/throwable-object.class.js"></script>
        <script src="classes/endboss.class.js"></script>
        <script src="classes/coins.class.js"></script>
        <script src="classes/bottles.class.js"></script>
        <script src="levels/level1.js"></script>
        <script src="js/game.js"></script>

        <title>El Pollo Loco</title>
    </head>
    <body>
        <div id="checkOrientation">Please rotate your device to landscape mode. <br>
            Bitte drehen Sie Ihr Gerät in den Querformatmodus</div>

            <!-- HEADLINE AND MUTE-BUTTON ON DESKTOP -->
            <div id="headline-mute-button-div" class="headline-mute-button-div">
                <h1 id="title">El Pollo Loco</h1>
                <div id="mute-btn-div" style="padding-right: 20px">
                    <img id="mute-on" onclick="toggleMute()" class="pointer speaker-icon" src="assets/icons/sound-turn-on.svg" alt="speaker-icon">
                    <img id="mute-off" onclick="toggleMute()" class="pointer speaker-icon d-none" src="assets/icons/sound-turn-off.svg" alt="speaker-icon">
                </div>
            </div>
           

            <!-- S T A R T S C R E E N -->
            <div id="start-screen" class="start-screen">

                <!-- Section about controls buttons (startscreen display) -->
                <div id="controls" class="controls-info-display">
                    <div class="btnInfo">
                        <span>D = Throw bottles</span>
                        <span> Space = Jump</span>
                        <span> < = Left / Right = ></span>
                    </div>
                    
                    <div class="playBtn pointer" onclick="startGame()">Play</div>
                </div> 

                <!-- Section about controls buttons (startscreen mobile) -->
                <div id="controls-mobile" class="controls-info-mobile d-none">
                    <div class="btnInfo">
                        <div class="info-icons-div"><img class="info-icon-arrow" style="transform: rotate(-180deg);" src="assets/icons/arrow.png" alt="arrow-icon"> = Left</div>
                        <div class="info-icons-div"><img class="info-icon-arrow" src="assets/icons/arrow.png" alt="arrow-icon"> = Right</div>
                        <div class="info-icons-div"><img class="info-icon-bottle" src="assets/icons/bottle.png" alt="bottle-icon"> = Throw</div>
                        <div class="info-icons-div"><img class="info-icon-arrow" style="transform: rotate(-90deg);" src="assets/icons/arrow.png" alt="arrow-icon"> = Jump</div>
                    </div>
                    <div class="playBtn pointer" onclick="startGame()">Play</div>
                </div> 

                <a href="imprint.html">Impressum</a>
                
            </div>


                <!-- C A N V A S -->
            <canvas id="canvas" width="720" height="480"></canvas>   
            

                <!--  Overlay for Mobile (MOBILE SCREEN) -->
            <div id="mobile-overlay" class="mobile-overlay d-none">
                <div class="panels-container">

                    <div class="panel-top">
                        <img id="speaker-on" onclick="toggleMute()" class="pointer speaker-icon" src="assets/icons/sound-turn-on.svg" alt="speaker-icon">
                        <img id="speaker-off" onclick="toggleMute()" class="pointer speaker-icon d-none" src="assets/icons/sound-turn-off.svg" alt="speaker-icon">
                    </div>

                    <div class="panel-bottom">
                        <div class="action-buttons">
                            <div class="div-as-button" id="btnLeft"><img class="arrow-icon" style="transform: rotate(-180deg);" src="assets/icons/arrow.png" alt="arrow-icon" draggable="false"></div>
                            <div class="div-as-button" id="btnRight"><img class="arrow-icon" src="assets/icons/arrow.png" alt="arrow-icon" draggable="false"></div>
                        </div> 
                        <div class="action-buttons">
                            <div class="div-as-button" id="btnJump" ><img class="arrow-icon" style="transform: rotate(-90deg);" src="assets/icons/arrow.png" alt="arrow-icon" draggable="false"></div>
                            <div class="div-as-button" id="btnThrow"><img class="bottle-icon" src="assets/icons/bottle.png" alt="bottle-icon" draggable="false"></div>
                        </div>
                    </div>

                </div>  
            </div>

            
            <!-- G A M E  O V E R  S C R E E N -->
            <div id="game-over-screen" class="game-over-screen d-none">
                <button class="restart-button pointer" onclick="stopGameAndRestart()">Start again?</button>
                <img id="you-won-img" class="game-over-img" src="" alt="you-won-image">
            </div>


            <!-- recommendation to change to the landscape on mobile devices-->
            <script>
                function checkOrientation() {
                    const warning = document.getElementById('checkOrientation');
                    if (window.innerWidth <= 480 && window.innerHeight > window.innerWidth) {
                    warning.style.display = 'flex';
                    } else {
                    warning.style.display = 'none';
                    }
                }
                window.addEventListener("load", checkOrientation);
                
                window.addEventListener("resize", checkOrientation);
                window.addEventListener("orientationchange", checkOrientation);
            </script>
    </body>
</html>
